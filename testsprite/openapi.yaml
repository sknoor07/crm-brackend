openapi: 3.0.3
info:
  title: CRM Backend API
  version: 1.0.0
  description: Repair-service workflow API for TestSprite API testing.
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Customer
  - name: Customer Service
  - name: Transport
  - name: Field Technician
  - name: Repair
  - name: Comments
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API availability
      responses:
        '200':
          description: API is available
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmployee'
      responses:
        '201': { description: Employee created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
  /api/v1/auth/invitation/accept:
    post:
      tags: [Auth]
      summary: Set a password using a customer invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
      responses:
        '200': { description: Invitation accepted }
        '400': { description: Invalid, expired, or used invitation }
  /api/v1/jobs/device-categories:
    get:
      tags: [Customer, Customer Service]
      summary: List configured device categories
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Categories returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/jobs:
    post:
      tags: [Customer Service]
      summary: Create a job for a customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCsJob'
      responses:
        '201': { description: Job created in ready_for_pickup }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/customer/jobs:
    post:
      tags: [Customer]
      summary: Create a self-service repair request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerJob'
      responses:
        '201': { description: Job created in pending_cs_verification }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/v1/customer/quote-response:
    patch:
      tags: [Customer]
      summary: Accept or reject a final quote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteResponse'
      responses:
        '200': { description: Quote response recorded }
        '403': { description: Customer does not own the job }
  /api/v1/cs/approve-job:
    patch:
      tags: [Customer Service]
      summary: Verify a self-service job
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveJob'
      responses:
        '200': { description: Job moved to ready_for_pickup }
  /api/v1/cs/pending-quotes:
    get:
      tags: [Customer Service]
      summary: List jobs waiting for final quotes
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pending quote jobs returned }
  /api/v1/cs/final-quote:
    patch:
      tags: [Customer Service]
      summary: Generate a final quote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalQuote'
      responses:
        '200': { description: Quote generated }
  /api/v1/cs/close:
    patch:
      tags: [Customer Service]
      summary: Close a job after CS verification
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseJob'
      responses:
        '200': { description: Job closed }
  /api/v1/transport/pending:
    get:
      tags: [Transport]
      summary: List jobs ready for pickup
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Pickup queue returned }
  /api/v1/transport/assign:
    patch:
      tags: [Transport]
      summary: Assign a pickup technician
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTechnician'
      responses:
        '200': { description: Job moved to pending_pickup }
  /api/v1/transport/receive-lab:
    patch:
      tags: [Transport]
      summary: Receive a device at the lab
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobId' }
      responses:
        '200': { description: Job moved to arrived_at_lab }
  /api/v1/transport/pending-deliveries:
    get:
      tags: [Transport]
      summary: List completed lab jobs awaiting delivery
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Delivery queue returned }
  /api/v1/transport/assign-delivery:
    patch:
      tags: [Transport]
      summary: Assign a return-delivery technician
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTechnician'
      responses:
        '200': { description: Job moved to out_for_delivery }
  /api/v1/technician/transit:
    patch:
      tags: [Field Technician]
      summary: Send a device to the lab
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobId' }
      responses:
        '200': { description: Job moved to in_transit_to_lab }
  /api/v1/technician/request-quote:
    patch:
      tags: [Field Technician]
      summary: Request an on-site repair quote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianQuoteRequest'
      responses:
        '200': { description: Job moved to pending_final_quote }
  /api/v1/technician/deliver:
    patch:
      tags: [Field Technician]
      summary: Confirm return delivery
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryConfirmation'
      responses:
        '200': { description: Job moved to delivered }
  /api/v1/repair/pending:
    get:
      tags: [Repair]
      summary: List lab jobs awaiting technician assignment
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lab queue returned }
  /api/v1/repair/assign:
    patch:
      tags: [Repair]
      summary: Assign a lab technician
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignLabTechnician'
      responses:
        '200': { description: Job moved to in_lab_diagnosis }
  /api/v1/repair/request-quote:
    patch:
      tags: [Repair]
      summary: Request a lab repair quote
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabQuoteRequest'
      responses:
        '200': { description: Job moved to pending_final_quote }
  /api/v1/repair/complete:
    patch:
      tags: [Repair]
      summary: Mark an on-site or lab repair complete
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairCompletion'
      responses:
        '200': { description: Job moved to repair_completed }
  /api/v1/comments:
    post:
      tags: [Comments]
      summary: Add an internal job comment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        '201': { description: Comment created }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid access token
    Forbidden:
      description: Authenticated user lacks the required role
    ValidationError:
      description: Request validation failed
  schemas:
    JobId:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
    RegisterEmployee:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AcceptInvitation:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 64, maxLength: 64 }
        password: { type: string, minLength: 8 }
    CreateCustomerJob:
      type: object
      required: [deviceCategory, issueDescription]
      properties:
        deviceCategory: { type: string }
        issueDescription: { type: string, minLength: 5 }
    CreateCsJob:
      type: object
      required: [customerEmail, customerPhone, customerFirstName, customerLastName, billingAddress, deviceCategory, issueDescription, estimatedComponentsCost]
      properties:
        customerEmail: { type: string, format: email }
        customerPhone: { type: string }
        customerFirstName: { type: string }
        customerLastName: { type: string }
        billingAddress: { type: string }
        deviceCategory: { type: string }
        issueDescription: { type: string, minLength: 5 }
        estimatedComponentsCost: { type: number, exclusiveMinimum: 0 }
    QuoteResponse:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          required: [decision]
          properties:
            decision: { type: string, enum: [accept, reject] }
    ApproveJob:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          properties:
            estimatedComponentsCost: { type: number, exclusiveMinimum: 0 }
    FinalQuote:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          required: [finalComponentsCost]
          properties:
            finalComponentsCost: { type: number, minimum: 0 }
    CloseJob:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          properties:
            closingRemarks: { type: string }
    AssignTechnician:
      type: object
      required: [jobId, technicianId]
      properties:
        jobId: { type: string, format: uuid }
        technicianId: { type: string, format: uuid }
    AssignLabTechnician:
      type: object
      required: [jobId, labTechId]
      properties:
        jobId: { type: string, format: uuid }
        labTechId: { type: string, format: uuid }
    TechnicianQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          required: [requestedComponents]
          properties:
            requestedComponents: { type: string }
            additionalNotes: { type: string }
    LabQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          required: [requestedComponents]
          properties:
            requestedComponents: { type: string }
            technicianNotes: { type: string }
    RepairCompletion:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          properties:
            repairNotes: { type: string }
    DeliveryConfirmation:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          properties:
            deliveryNotes: { type: string }
    Comment:
      allOf:
        - $ref: '#/components/schemas/JobId'
        - type: object
          required: [comment]
          properties:
            comment: { type: string, minLength: 1 }
